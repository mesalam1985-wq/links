<style>
  :root {
    --bg1: #0b1220; --bg2: #13233f; --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.12);
    --text: #f3f6fb; --muted: #a9b4c8; --accent: #34d399;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(52, 211, 153, .18), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(56, 189, 248, .16), transparent 45%),
      linear-gradient(170deg, var(--bg2), var(--bg1) 70%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: calc(36px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }
  .avatar {
    width: 112px; height: 112px; border-radius: 30px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 4px rgba(255,255,255,.08);
    animation: rise .5s ease both;
  }
  h1 { margin: 18px 0 4px; font-size: 28px; font-weight: 800; letter-spacing: -.3px; animation: rise .5s .05s ease both; }
  .tag { margin: 0; color: var(--muted); font-size: 15.5px; text-align: center; line-height: 1.7; animation: rise .5s .1s ease both; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 14px 0 26px; animation: rise .5s .15s ease both; }
  .pills span { font-size: 12.5px; color: #d6fbe9; background: rgba(52, 211, 153, .12); border: 1px solid rgba(52, 211, 153, .3); padding: 4px 11px; border-radius: 999px; }
  .links { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: 18px;
    text-decoration: none; color: var(--text);
    background: var(--card); border: 1px solid var(--line);
    backdrop-filter: blur(8px);
    transition: transform .15s, background .15s, border-color .15s;
    animation: rise .5s ease both;
  }
  .link:nth-child(1) { animation-delay: .2s; } .link:nth-child(2) { animation-delay: .26s; }
  .link:nth-child(3) { animation-delay: .32s; } .link:nth-child(4) { animation-delay: .38s; }
  .link:hover { transform: translateY(-2px); background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.22); }
  .link:active { transform: scale(.98); }
  .ic { width: 50px; height: 50px; border-radius: 15px; flex: none; display: grid; place-items: center; }
  .ic svg { width: 28px; height: 28px; fill: #fff; }
  .txt { flex: 1; min-width: 0; }
  .txt b { display: block; font-size: 17px; }
  .txt small { color: var(--muted); font-size: 13px; display: block; }  .txt small[dir=ltr] { text-align: right; }
  .arrow { color: var(--muted); font-size: 20px; }
  .wa .ic { background: #25d366; } .wa { border-color: rgba(37, 211, 102, .45); background: rgba(37, 211, 102, .12); }
  .wa:hover { background: rgba(37, 211, 102, .2); border-color: rgba(37, 211, 102, .7); }
  .fb .ic { background: #1877f2; }
  .ig .ic { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
  .tt .ic { background: #000; box-shadow: inset 2px 0 0 #25f4ee, inset -2px 0 0 #fe2c55; }
  footer { margin-top: 30px; color: #6f7c93; font-size: 12.5px; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
